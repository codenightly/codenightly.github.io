<!DOCTYPE html>
<html lang="en">
<head>
<!--
  ═══════════════════════════════════════════════════════════════════════
  SECURITY & SOFTWARE ENGINEER — PORTFOLIO TEMPLATE
  ═══════════════════════════════════════════════════════════════════════

  HOW TO CUSTOMIZE (3 steps):

  1. CONTENT — Scroll to the script tag at the bottom and edit the
     SITE_DATA object. Every word on this page (name, skills, projects,
     experience, links, PGP key) lives there. Change the data, refresh,
     done. No HTML editing required.

  2. THEME — All colors, fonts and spacing are CSS custom properties in
     the :root block below. Change --accent to rebrand the whole page
     in one line. A light theme only needs new values for the first
     eight tokens.

  3. FONTS — Swap the Google Fonts <link> below and update --font-display,
     --font-body, --font-mono in :root.

  Accessibility & quality built in: semantic landmarks, skip link,
  keyboard focus states, prefers-reduced-motion support, print styles,
  Open Graph tags, no external JS dependencies. Single file, deploy
  anywhere (GitHub Pages, Netlify, S3, nginx).
  ═══════════════════════════════════════════════════════════════════════
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Security engineer and software engineer. Offensive testing, detection engineering, and building systems that assume breach.">
<meta property="og:type" content="website">
<meta property="og:title" content="Jordan Reyes — Security & Software Engineer">
<meta property="og:description" content="Offensive testing, detection engineering, and building systems that assume breach.">

<style>
/* ═══════════════ 1. DESIGN TOKENS — edit here to re-theme ═══════════════ */
:root{
  --bg:        #0B1220;   /* page background            */
  --bg-2:      #0E1729;   /* alternating section band   */
  --panel:     #121D33;   /* cards & terminal           */
  --panel-2:   #16233D;   /* card hover                 */
  --line:      #22304D;   /* borders & rules            */
  --text:      #DDE6F5;   /* primary text               */
  --muted:     #91A3C2;   /* secondary text             */
  --accent:    #FFB454;   /* THE brand color — amber phosphor */
  --accent-dim:#B87C2E;
  --accent-ink:#1A1206;   /* text on accent surfaces    */
  --ok:        #6EE7A0;
  --warn:      #FFD37A;
  --bad:       #FF7A7A;

  --font-display:'Archivo', system-ui, sans-serif;
  --font-body:  'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:  'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --max-w: 1120px;
  --pad-x: clamp(20px, 4vw, 48px);
  --radius: 10px;
}

/* ═══════════════ 2. BASE ═══════════════ */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  /* faint schematic grid over the whole page */
  background-image:
    linear-gradient(rgba(145,163,194,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(145,163,194,.045) 1px, transparent 1px);
  background-size:44px 44px;
}
::selection{ background:var(--accent); color:var(--accent-ink); }
a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:3px; }
section{ scroll-margin-top:96px; }
img{ max-width:100%; }
button{ font:inherit; cursor:pointer; }

.wrap{ max-width:var(--max-w); margin:0 auto; padding:0 var(--pad-x); }
.skip{
  position:absolute; left:-9999px; top:0; z-index:100;
  background:var(--accent); color:var(--accent-ink);
  padding:10px 16px; font-family:var(--font-mono); font-size:14px; border-radius:0 0 8px 0;
}
.skip:focus{ left:0; }

/* ═══════════════ 3. STATUS BAR + NAV ═══════════════ */
.statusbar{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.06em;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  background:rgba(11,18,32,.9);
}
.statusbar .wrap{ display:flex; align-items:center; gap:10px; padding-top:7px; padding-bottom:7px; }
.pulse{
  width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none;
  box-shadow:0 0 0 0 rgba(110,231,160,.5); animation:pulse 2.2s infinite;
}
@keyframes pulse{ 70%{ box-shadow:0 0 0 7px rgba(110,231,160,0);} 100%{ box-shadow:0 0 0 0 rgba(110,231,160,0);} }
.statusbar b{ color:var(--text); font-weight:500; }
.statusbar .right{ margin-left:auto; display:none; }
@media(min-width:640px){ .statusbar .right{ display:block; } }

.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(11,18,32,.82);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav .wrap{ display:flex; align-items:center; gap:24px; height:64px; }
.brand{
  font-family:var(--font-mono); font-weight:600; font-size:15px; color:var(--text);
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.brand:hover{ text-decoration:none; }
.brand .prompt{ color:var(--accent); }
.brand .cursor{ display:inline-block; width:8px; height:16px; background:var(--accent); animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.nav-links{ margin-left:auto; display:flex; gap:4px; list-style:none; padding:0; }
.nav-links a{
  font-family:var(--font-mono); font-size:13.5px; color:var(--muted);
  padding:8px 12px; border-radius:6px;
}
.nav-links a:hover{ color:var(--text); text-decoration:none; background:rgba(255,180,84,.07); }
.nav-links a.active{ color:var(--accent); }
.menu-btn{
  margin-left:auto; display:none; background:none; border:1px solid var(--line);
  color:var(--text); border-radius:8px; padding:8px 12px; font-family:var(--font-mono); font-size:13px;
}
@media(max-width:820px){
  .menu-btn{ display:block; }
  .nav-links{
    position:absolute; top:64px; left:0; right:0;
    flex-direction:column; gap:0; margin:0;
    background:rgba(11,18,32,.97); border-bottom:1px solid var(--line);
    display:none; padding:8px var(--pad-x) 16px;
  }
  .nav.open .nav-links{ display:flex; }
  .nav-links a{ display:block; padding:12px 8px; font-size:15px; }
}

/* ═══════════════ 4. HERO ═══════════════ */
.hero{ position:relative; overflow:hidden; }
.hero::before{ /* soft amber glow, top left */
  content:""; position:absolute; top:-220px; left:-180px; width:640px; height:640px;
  background:radial-gradient(closest-side, rgba(255,180,84,.13), transparent 70%);
  pointer-events:none;
}
.hero .wrap{
  display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center;
  padding-top:clamp(56px,9vh,110px); padding-bottom:clamp(56px,9vh,110px);
}
@media(max-width:920px){ .hero .wrap{ grid-template-columns:1fr; gap:44px; } }

.eyebrow{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.14em;
  color:var(--accent); text-transform:uppercase;
  display:inline-flex; align-items:center; gap:10px;
}
.eyebrow::before{ content:""; width:26px; height:1px; background:var(--accent); }

.hero h1{
  font-family:var(--font-display); font-weight:900;
  font-size:clamp(40px, 6.2vw, 72px);
  line-height:1.02; letter-spacing:-.025em; margin:14px 0 10px;
}
.hero .role{
  font-family:var(--font-mono); font-size:clamp(15px,1.6vw,18px);
  color:var(--muted); margin:0 0 18px;
}
.hero .role em{ color:var(--text); font-style:normal; }
.hero .tagline{ max-width:52ch; color:var(--muted); margin:0 0 26px; font-size:17px; }

.fingerprint{
  font-family:var(--font-mono); font-size:12.5px; color:var(--muted);
  border:1px dashed var(--line); border-radius:8px;
  padding:8px 12px; display:inline-flex; gap:10px; align-items:center;
  margin-bottom:28px; background:rgba(18,29,51,.5);
}
.fingerprint b{ color:var(--accent); font-weight:500; letter-spacing:.04em; }

.cta-row{ display:flex; flex-wrap:wrap; gap:14px; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:14.5px; font-weight:500;
  padding:12px 22px; border-radius:8px; border:1px solid transparent;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{ text-decoration:none; transform:translateY(-2px); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 24px rgba(255,180,84,.25); }
.btn-primary:hover{ box-shadow:0 8px 32px rgba(255,180,84,.35); }
.btn-ghost{ border-color:var(--line); color:var(--text); background:rgba(18,29,51,.4); }
.btn-ghost:hover{ border-color:var(--accent-dim); }

/* — terminal window (signature element) — */
.term{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,180,84,.04);
  font-family:var(--font-mono); font-size:13.5px; line-height:1.85;
  overflow:hidden;
}
.term-bar{
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-bottom:1px solid var(--line);
  background:rgba(11,18,32,.6);
}
.term-bar i{ width:11px; height:11px; border-radius:50%; background:var(--line); }
.term-bar i:nth-child(1){ background:#FF6159; } .term-bar i:nth-child(2){ background:#FFBD2E; } .term-bar i:nth-child(3){ background:#28C840; }
.term-bar span{ margin-left:8px; font-size:12px; color:var(--muted); }
.term-body{ padding:18px 20px 22px; min-height:284px; }
.term-body .ln{ display:block; white-space:pre-wrap; word-break:break-word; }
.term-body .cmd{ color:var(--text); }
.term-body .cmd .ps1{ color:var(--accent); }
.t-ok{ color:var(--ok); } .t-warn{ color:var(--warn); } .t-bad{ color:var(--bad); }
.t-label{ color:var(--muted); display:inline-block; min-width:15ch; }
.t-result{ color:var(--accent); font-weight:600; margin-top:6px; display:block; text-shadow:0 0 18px rgba(255,180,84,.4); }
.term-cursor{ display:inline-block; width:8px; height:15px; background:var(--accent); vertical-align:-2px; animation:blink 1.1s steps(1) infinite; }

/* ═══════════════ 5. SECTIONS ═══════════════ */
.section{ padding:clamp(64px,9vh,104px) 0; border-top:1px solid var(--line); }
.section.alt{ background:var(--bg-2); }
.sec-head{ margin-bottom:40px; }
.sec-tag{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.14em;
  color:var(--accent); text-transform:uppercase;
}
.sec-tag::before{ content:"[ "; color:var(--muted); }
.sec-tag::after{ content:" ]"; color:var(--muted); }
.sec-head h2{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(28px,3.6vw,40px); letter-spacing:-.02em;
  margin:10px 0 0;
}
.sec-head p.sub{ color:var(--muted); max-width:64ch; margin:12px 0 0; }

/* profile */
.profile-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:56px; }
@media(max-width:880px){ .profile-grid{ grid-template-columns:1fr; gap:36px; } }
.profile-grid p{ margin:0 0 18px; color:var(--text); }
.profile-grid p:last-child{ margin-bottom:0; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:start; }
.stat{
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); padding:18px 20px;
}
.stat .num{
  font-family:var(--font-display); font-weight:800; font-size:30px;
  letter-spacing:-.02em; color:var(--accent);
}
.stat .lbl{ font-family:var(--font-mono); font-size:12px; color:var(--muted); letter-spacing:.05em; margin-top:2px; }

/* capabilities */
.cap-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
@media(max-width:880px){ .cap-grid{ grid-template-columns:1fr; } }
.cap-card{
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); padding:24px 26px;
}
.cap-card h3{
  font-family:var(--font-mono); font-size:14px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--text);
  margin:0 0 18px; display:flex; align-items:center; gap:10px;
}
.cap-card h3::after{ content:""; flex:1; height:1px; background:var(--line); }
.skill{ display:flex; align-items:baseline; gap:12px; padding:7px 0; }
.skill .name{ font-size:15px; flex:1; }
.skill .meter{ font-family:var(--font-mono); font-size:13px; letter-spacing:2px; color:var(--accent); white-space:nowrap; }
.skill .meter .off{ color:var(--line); }

.cred-strip{ margin-top:36px; display:flex; flex-wrap:wrap; gap:12px; }
.cred{
  font-family:var(--font-mono); font-size:13px;
  border:1px solid var(--line); border-radius:999px;
  background:rgba(18,29,51,.6); padding:8px 16px; color:var(--muted);
}
.cred b{ color:var(--accent); font-weight:600; margin-right:6px; }

/* experience */
.timeline{ position:relative; margin:0; padding:0 0 0 28px; list-style:none; border-left:1px solid var(--line); }
.tl-item{ position:relative; padding:0 0 40px 22px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-item::before{
  content:""; position:absolute; left:-33px; top:7px;
  width:9px; height:9px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 4px rgba(255,180,84,.15);
}
.tl-item .period{ font-family:var(--font-mono); font-size:13px; color:var(--accent); letter-spacing:.05em; }
.tl-item h3{ font-family:var(--font-display); font-weight:700; font-size:21px; margin:6px 0 2px; letter-spacing:-.01em; }
.tl-item .org{ font-family:var(--font-mono); font-size:14px; color:var(--muted); }
.tl-item p{ color:var(--muted); margin:12px 0 14px; max-width:70ch; }
.tags{ display:flex; flex-wrap:wrap; gap:8px; padding:0; margin:0; list-style:none; }
.tags li{
  font-family:var(--font-mono); font-size:12px; color:var(--muted);
  border:1px solid var(--line); border-radius:6px; padding:4px 10px;
}

/* projects */
.proj-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
@media(max-width:880px){ .proj-grid{ grid-template-columns:1fr; } }
.proj{
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); padding:26px 28px;
  display:flex; flex-direction:column; gap:14px;
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
}
.proj:hover{ transform:translateY(-4px); border-color:var(--accent-dim); background:var(--panel-2); }
.proj .kind{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }
.proj h3{ font-family:var(--font-display); font-weight:700; font-size:22px; margin:0; letter-spacing:-.01em; }
.proj p{ color:var(--muted); margin:0; flex:1; }
.proj .links{ display:flex; gap:18px; font-family:var(--font-mono); font-size:13.5px; }
.proj .links a::after{ content:" ↗"; color:var(--muted); }

/* writing */
.pub-list{ list-style:none; margin:0; padding:0; }
.pub{
  display:grid; grid-template-columns:150px 1fr; gap:24px;
  padding:22px 4px; border-bottom:1px solid var(--line); align-items:baseline;
}
.pub:first-child{ border-top:1px solid var(--line); }
@media(max-width:640px){ .pub{ grid-template-columns:1fr; gap:4px; } }
.pub .date{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
.pub h3{ font-size:17.5px; font-weight:600; margin:0; font-family:var(--font-body); }
.pub h3 a{ color:var(--text); }
.pub h3 a:hover{ color:var(--accent); }
.pub .venue{ font-family:var(--font-mono); font-size:13px; color:var(--accent-dim); margin-top:3px; }

/* contact */
.contact-box{ text-align:left; max-width:760px; }
.contact-box .bigmail{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(24px,4.4vw,44px); letter-spacing:-.02em;
  color:var(--text); word-break:break-all;
}
.contact-box .bigmail:hover{ color:var(--accent); text-decoration:none; }
.contact-links{ display:flex; flex-wrap:wrap; gap:14px; margin:30px 0 0; }
.pgp{ margin-top:36px; }
.pgp summary{
  cursor:pointer; font-family:var(--font-mono); font-size:14px; color:var(--muted);
  list-style:none; display:inline-flex; align-items:center; gap:8px;
}
.pgp summary::before{ content:"▸"; color:var(--accent); transition:transform .15s; }
.pgp[open] summary::before{ transform:rotate(90deg); }
.pgp pre{
  margin:14px 0 0; padding:18px 20px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  font-family:var(--font-mono); font-size:12px; color:var(--muted);
  overflow-x:auto; line-height:1.7;
}
.copy-btn{
  background:none; border:1px solid var(--line); color:var(--muted);
  font-family:var(--font-mono); font-size:12px; border-radius:6px; padding:4px 10px;
}
.copy-btn:hover{ color:var(--accent); border-color:var(--accent-dim); }

/* footer */
footer{ border-top:1px solid var(--line); padding:34px 0 44px; }
footer .wrap{
  display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between;
  font-family:var(--font-mono); font-size:13px; color:var(--muted);
}

/* reveal on scroll */
.reveal{ opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
.reveal.in{ opacity:1; transform:none; }

/* ═══════════════ 6. MOTION & PRINT SAFETY ═══════════════ */
@media(prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation:none !important; transition:none !important; }
  .reveal{ opacity:1; transform:none; }
}
@media print{
  body{ background:#fff; color:#111; }
  .statusbar,.nav,.term,.cta-row,.menu-btn,footer .right{ display:none !important; }
  .section{ border:none; padding:24px 0; }
  a{ color:#111; }
}
</style>
</head>
<body>

<a class="skip" href="#profile">Skip to content</a>

<div class="statusbar" role="status">
  <div class="wrap">
    <span class="pulse" aria-hidden="true"></span>
    <span id="status-text">STATUS: <b>—</b></span>
    <span class="right" id="status-loc"></span>
  </div>
</div>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"><span class="prompt">➜</span> <span id="brand-text">~</span><span class="cursor" aria-hidden="true"></span></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-links">menu</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="#profile">profile</a></li>
      <li><a href="#capabilities">capabilities</a></li>
      <li><a href="#experience">experience</a></li>
      <li><a href="#projects">projects</a></li>
      <li><a href="#writing">writing</a></li>
      <li><a href="#contact">contact</a></li>
    </ul>
  </div>
</header>

<main id="top">

  <!-- ══════════ HERO ══════════ -->
  <section class="hero" aria-label="Introduction">
    <div class="wrap">
      <div>
        <span class="eyebrow" id="hero-eyebrow"></span>
        <h1 id="hero-name"></h1>
        <p class="role" id="hero-role"></p>
        <p class="tagline" id="hero-tagline"></p>
        <div class="fingerprint" id="hero-fp" title="PGP key fingerprint">
          <span>PGP</span><b id="fp-value"></b>
          <button class="copy-btn" data-copy-target="fp-value" aria-label="Copy PGP fingerprint">copy</button>
        </div>
        <div class="cta-row" id="hero-ctas"></div>
      </div>

      <div class="term" role="img" aria-label="Animated terminal running a mock security audit that returns: all checks passed">
        <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span id="term-title"></span></div>
        <div class="term-body" id="term-body" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- ══════════ PROFILE ══════════ -->
  <section class="section" id="profile">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="sec-tag">profile</span>
        <h2 id="profile-title"></h2>
      </div>
      <div class="profile-grid">
        <div id="profile-copy" class="reveal"></div>
        <div class="stats reveal" id="profile-stats"></div>
      </div>

  /* — terminal animation (signature element) — */
  const term = $("term-body");
  $("term-title").textContent = D.terminal.title;
  const T = D.terminal;

  function termRowHTML(l){
    const mark = l.tag === "ok" ? "[ ok ]" : l.tag === "warn" ? "[warn]" : "[fail]";
    const cls  = l.tag === "ok" ? "t-ok"   : l.tag === "warn" ? "t-warn" : "t-bad";
    return `<span class="ln"><span class="${cls}">${mark}</span> <span class="t-label">${esc(l.label)}</span> ${esc(l.text)}</span>`;
  }

  function renderTermInstant(){
    term.innerHTML =
      `<span class="ln cmd"><span class="ps1">$</span> ${esc(T.command)}</span>` +
      T.lines.map(termRowHTML).join("") +
      `<span class="t-result">${esc(T.result)}</span>` +
      `<span class="ln cmd"><span class="ps1">$</span> <span class="term-cursor"></span></span>`;
  }

  function renderTermAnimated(){
    const cmdLine = document.createElement("span");
    cmdLine.className = "ln cmd";
    cmdLine.innerHTML = `<span class="ps1">$</span> `;
    const typed = document.createElement("span");
    const cursor = document.createElement("span");
    cursor.className = "term-cursor";
    cmdLine.appendChild(typed);
    cmdLine.appendChild(cursor);
    term.appendChild(cmdLine);

    let i = 0;
    (function typeChar(){
      if(i < T.command.length){
        typed.textContent += T.command[i++];
        setTimeout(typeChar, 26 + Math.random()*40);
      } else {
        cursor.remove();
        let j = 0;
        (function nextLine(){
          if(j < T.lines.length){
            term.insertAdjacentHTML("beforeend", termRowHTML(T.lines[j++]));
            setTimeout(nextLine, 240);
          } else {
            setTimeout(() => {
              term.insertAdjacentHTML("beforeend", `<span class="t-result">${esc(T.result)}</span>`);
              term.insertAdjacentHTML("beforeend", `<span class="ln cmd"><span class="ps1">$</span> <span class="term-cursor"></span></span>`);

          }
